# Staging. Password protected and never indexable.
app = "wlc-site-staging"
primary_region = "iad"
# fly.io stops a machine with SIGINT. The server finishes requests and deliveries under way;
# give it the time to (the default is 5 seconds, shorter than a phone uploading photos).
kill_signal = "SIGINT"
kill_timeout = 30
# Headroom for a large photo being cleaned while pages are served (no swap by default).
swap_size_mb = 512

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TZ = "America/New_York"
  # A request to the app's fly.dev address is redirected here.
  CANONICAL_HOST = "staging.weddinglightingco.com"
  # Sender of the quote notification. An alias on the Workspace user the site signs in as (SMTP_USER, set as a secret).
  QUOTE_EMAIL_FROM = "quotes@weddinglightingco.com"
  # Gmail's own sending server, signed in as the Workspace user in SMTP_USER. The SMTP relay service
  # (smtp-relay.gmail.com) refused connections from fly.io with 421 4.7.0 at EHLO.
  SMTP_HOST = "smtp.gmail.com"
  # Inbox that receives each quote request. TODO(owner): staging should send to a test mailbox,
  # not the office (docs/phase-1/ARCHITECTURE.md section 11). Until then every staging
  # notification is marked "[STAGING]" in its subject. Leave LEAD_INTAKE_URL unset on staging,
  # or point it at a GigFriend test door, so test requests never become real leads.
  QUOTE_EMAIL_TO = "info@weddinglightingco.com"
  STAGING = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Counted in requests, not connections, with room for slow uploads.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
[build.args]
  PUBLIC_STAGING = "1"
