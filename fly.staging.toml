# Staging. Password protected and never indexable.
app = "wlc-site-staging"
primary_region = "iad"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TZ = "America/New_York"
  # Sender of the quote notification. An alias on the Workspace user the site signs in as (SMTP_USER, set as a secret).
  QUOTE_EMAIL_FROM = "quotes@weddinglightingco.com"
  # Gmail's own sending server, signed in as the Workspace user in SMTP_USER. The SMTP relay service
  # (smtp-relay.gmail.com) refused connections from fly.io with 421 4.7.0 at EHLO.
  SMTP_HOST = "smtp.gmail.com"
  # Inbox that receives each quote request.
  QUOTE_EMAIL_TO = "info@weddinglightingco.com"
  STAGING = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
[build.args]
  PUBLIC_STAGING = "1"
