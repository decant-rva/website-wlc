# Staging. Password protected and never indexable.
app = "wlc-site-staging"
primary_region = "iad"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  TZ = "America/New_York"
  STAGING = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
[build.args]
  PUBLIC_STAGING = "1"
