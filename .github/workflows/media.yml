# Fills the photo bucket. Run it by hand from the Actions tab after adding or
# changing photos. It rebuilds every size from the originals and uploads what
# the bucket does not have yet.
#
# Needs these repository secrets (the values `fly storage create` prints):
#   BUCKET_NAME, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL_S3, AWS_REGION
name: media
on:
  workflow_dispatch:
  # Temporary: GitHub only offers a manual run once this file is on the default branch.
  # Until this branch is merged, a push that changes this file starts the upload. Remove after the merge.
  push:
    branches: [beam-lines-build]
    paths: ['.github/workflows/media.yml']
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tools/media.js --rebuild --upload
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
